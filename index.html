<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commons Reader · Malayalam Wikisource Gallery</title>
<style>
:root{--desk:#e4e8ef;--bar:#f7f8fa;--ink:#1b2230;--mute:#5d6778;--line:#c9d0db;--accent:#2a5db0;--accent-ink:#fff;--shadow:0 4px 16px rgba(20,30,50,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#161b26;--bar:#202736;--ink:#e8ecf3;--mute:#9aa5b8;--line:#33405a;--accent:#6ea2f0;--accent-ink:#0d1626;--shadow:0 6px 20px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--desk:#161b26;--bar:#202736;--ink:#e8ecf3;--mute:#9aa5b8;--line:#33405a;--accent:#6ea2f0;--accent-ink:#0d1626;--shadow:0 6px 20px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Malayalam",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tabs{display:flex;gap:2px;align-self:flex-end;margin:0 4px}.tabs a{padding:6px 14px;border:1px solid transparent;border-radius:6px;text-decoration:none;color:var(--mute);font-weight:500}.tabs a:hover{color:var(--ink)}.tabs a[aria-current]{color:var(--ink);background:var(--desk);border-color:var(--line);font-weight:600}
h1{font:600 18px Georgia,"Noto Serif Malayalam",serif;margin:0 6px 0 0}
h1 small{display:block;font:400 12px system-ui;color:var(--mute)}
.f{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--desk)}
#q{flex:1 1 220px;min-width:160px}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bar);cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--bar);padding:6px 11px;cursor:pointer}
.seg button:last-child{border:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
#count{color:var(--mute);font-size:13px;white-space:nowrap}
#prog{height:3px;position:sticky;top:0}
#prog.on::after{content:"";display:block;height:3px;width:35%;background:var(--accent);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{margin-left:-35%}100%{margin-left:100%}}
main{padding:18px 14px 40px;max-width:1500px;margin:0 auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px 16px}
.card{background:var(--bar);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card[hidden]{display:none}
.cover{display:block;aspect-ratio:3/4;position:relative;background:repeating-linear-gradient(135deg,#eceef2 0 12px,#e2e6ec 12px 24px);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;color:#5a6577;font:600 13px Georgia,serif}
.tag{position:absolute;top:6px;right:6px;background:rgba(20,30,50,.78);color:#fff;font-size:11px;letter-spacing:.5px;padding:1px 7px;border-radius:99px}
.meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.ti{font-weight:600;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ti a{color:inherit;text-decoration:none}
.fn{font-size:12px;color:var(--mute);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ln{margin-top:auto;padding-top:6px;display:flex;gap:10px;font-size:12px;flex-wrap:wrap}
.msg{text-align:center;color:var(--mute);padding:50px 10px}
.msg.err{color:#c0392b}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:0 14px 24px}
#rd{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--desk)}
body.rm header,body.rm main,body.rm footer,body.rm #prog{display:none}
@media (prefers-reduced-motion:reduce){.card{transition:none}#prog.on::after{animation-duration:2.4s}}
</style>
</head>
<body>
<header>
  <h1>Commons Reader<small>Malayalam Wikisource book gallery · മലയാളം വിക്കിഗ്രന്ഥശാല</small></h1>
  <nav class="tabs" aria-label="Site"><a href="./" aria-current="page">Gallery</a><a href="?file=">Reader</a></nav>
  <input id="q" class="f" type="search" placeholder="Search title or file name…" aria-label="Search">
  <div class="seg" id="types" role="group" aria-label="File type">
    <button data-t="" aria-pressed="true">All</button><button data-t="pdf" aria-pressed="false">PDF</button><button data-t="djvu" aria-pressed="false">DjVu</button>
  </div>
  <select id="sort" class="f" aria-label="Sort"><option value="list">List order</option><option value="az">Title A–Z</option><option value="type">File type</option></select>
  <span id="count"></span>
  <button class="btn" id="theme" aria-label="Toggle dark mode">◐</button>
</header>
<div id="prog" class="on"></div>
<main>
  <div id="grid"></div>
  <div class="msg" id="msg">Loading book list…</div>
</main>
<footer>Commons Reader · covers are page 1 of each file on Wikimedia Commons (or ml.wikisource.org); titles come from Wikidata. Click a book to open it in the reader.</footer>

<iframe id="rd" title="Commons Reader" hidden></iframe>
<script>
const $=s=>document.querySelector(s);
/* ?file=… shows the reader on this same address (no /reader/ in the URL) */
const RM=new URLSearchParams(location.search).has('file');
if(RM){
  document.body.classList.add('rm');
  const fr=$('#rd'); fr.src='reader/'+location.search; fr.hidden=false;
  fr.addEventListener('load',()=>{try{fr.contentWindow.focus()}catch(e){}});
  addEventListener('message',e=>{
    if(e.origin!==location.origin||!e.data||!e.data.file) return;
    const u=new URL(location.href); u.searchParams.set('file',e.data.file);
    history.replaceState(null,'',u); if(e.data.title) document.title=e.data.title;
  });
}
const READER='', WD='https://www.wikidata.org/w/api.php';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let books=[], type='';

function parseList(text){
  const out=[], seen=new Set();
  text.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(line=>{
    const c=line.split(line.includes('\t')?'\t':',').map(x=>x.trim().replace(/^"|"$/g,''));
    const f=(c[0]||'').replace(/^(File|Image):/i,'').replace(/_/g,' ').trim();
    const q=(c[1]||'').match(/Q\d+/i)?.[0].toUpperCase()||'';
    if(!/\.(pdf|djvu)$/i.test(f)) return;          // skips header, blanks, non-PDF/DjVu rows
    if(seen.has(f)) return; seen.add(f);
    out.push({f,q,ext:/\.pdf$/i.test(f)?'pdf':'djvu',label:'',i:out.length});
  });
  return out;
}
const base=f=>f.replace(/\.(pdf|djvu)$/i,'');
const fileUrl=f=>encodeURIComponent(f.replace(/ /g,'_'));

function render(){
  const g=$('#grid');
  g.innerHTML=books.map(b=>{
    const rd=READER+'?file='+fileUrl(b.f);
    return `<article class="card" data-i="${b.i}">
      <a class="cover" href="${rd}" title="${esc(b.f)}" aria-label="Open ${esc(b.f)} in the reader">
        <div class="ph">${esc(base(b.f))}</div>
        <img loading="lazy" decoding="async" alt="" src="https://commons.wikimedia.org/wiki/Special:FilePath/${fileUrl(b.f)}?width=320">
        <span class="tag">${b.ext==='pdf'?'PDF':'DjVu'}</span>
      </a>
      <div class="meta">
        <div class="ti"><a href="${rd}">${esc(base(b.f))}</a></div>
        <div class="ln">
          <a href="https://ml.wikisource.org/wiki/Index:${fileUrl(b.f)}" target="_blank" rel="noopener">Read in Wikisource</a>
          ${b.q?`<a href="https://www.wikidata.org/wiki/${b.q}" target="_blank" rel="noopener">Wikidata</a>`:''}
        </div></div></article>`;}).join('');
  g.querySelectorAll('.card').forEach(c=>{
    const img=c.querySelector('img');
    img.addEventListener('load',()=>c.querySelector('.ph')?.remove());
    img.addEventListener('error',()=>{
      if(img.dataset.ws){img.remove();return;}
      // not served from Commons: use the file on Malayalam Wikisource
      img.dataset.ws=1; const b=books[+c.dataset.i];
      img.src='https://ml.wikisource.org/wiki/Special:FilePath/'+fileUrl(b.f)+'?width=320';
    });
  });
  applyFilter();
}
function applyFilter(){
  const q=$('#q').value.trim().toLowerCase(); let n=0;
  document.querySelectorAll('.card').forEach(c=>{
    const b=books[+c.dataset.i];
    const ok=(!type||b.ext===type)&&(!q||(b.f+' '+b.label+' '+b.q).toLowerCase().includes(q));
    c.hidden=!ok; if(ok)n++;
  });
  $('#count').textContent=n+' of '+books.length+' books';
  $('#msg').hidden=n>0||!books.length; if(!n&&books.length) $('#msg').textContent='No books match.';
}
function applySort(){
  const m=$('#sort').value, g=$('#grid'), cards=[...g.children];
  const key=c=>books[+c.dataset.i];
  cards.sort((a,b)=>{const x=key(a),y=key(b);
    if(m==='az') return (x.label||base(x.f)).localeCompare(y.label||base(y.f),'ml');
    if(m==='type') return x.ext.localeCompare(y.ext)||x.i-y.i;
    return x.i-y.i;}).forEach(c=>g.appendChild(c));
}

/* titles from Wikidata, 50 IDs per request */
let labelRun=0;
async function loadLabels(){
  const run=++labelRun, ids=[...new Set(books.map(b=>b.q).filter(Boolean))], chunks=[];
  for(let i=0;i<ids.length;i+=50) chunks.push(ids.slice(i,i+50));
  $('#prog').classList.add('on');
  const worker=async()=>{
    while(chunks.length&&run===labelRun){
      const ch=chunks.shift();
      try{
        const u=new URL(WD);
        Object.entries({action:'wbgetentities',format:'json',origin:'*',ids:ch.join('|'),props:'labels',languages:'ml|en',languagefallback:'1'}).forEach(([k,v])=>u.searchParams.set(k,v));
        const d=await (await fetch(u)).json();
        books.forEach(b=>{
          const l=d.entities?.[b.q]?.labels; if(!l) return;
          const t=(l.ml||l.en||Object.values(l)[0])?.value; if(!t) return;
          b.label=t;
          const el=document.querySelector(`.card[data-i="${b.i}"] .ti a`); if(el) el.textContent=t;
        });
      }catch(e){}
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  if(run===labelRun){ $('#prog').classList.remove('on'); applyFilter(); if($('#sort').value==='az') applySort(); }
}

function setBooks(list){
  books=list; $('#msg').hidden=!!list.length;
  if(!list.length){ $('#grid').innerHTML=''; $('#msg').className='msg err'; $('#msg').textContent='No PDF/DjVu file names found in the list.'; $('#msg').hidden=false; $('#prog').classList.remove('on'); $('#count').textContent=''; return; }
  $('#msg').className='msg'; render(); applySort(); loadLabels();
}

(async()=>{
  if(RM) return;
  const names=['books.tsv','books.txt','books.tsv.txt']; let why='';
  for(const n of names){
    try{
      const r=await fetch(n,{cache:'no-cache'});
      if(!r.ok){why+=n+' → HTTP '+r.status+'\n';continue;}
      const t=await r.text(); setBooks(parseList(t)); return;
    }catch(e){why+=n+' → '+(location.protocol==='file:'?'blocked (page opened as a local file)':'network error')+'\n';}
  }
  $('#prog').classList.remove('on'); $('#msg').className='msg err';
  $('#msg').innerHTML='Could not load <code>books.tsv</code>.<br><small>Looked for it next to this page ('+esc(new URL('.',location.href).href)+').'+
    (location.protocol==='file:'?'<br>This page was opened as a local file; browsers block that. Open it from GitHub Pages or run <code>python3 -m http.server</code> in this folder.':'<br>Check the file name and that it sits next to this page.')+
    '</small><pre style="text-align:left;display:inline-block;font-size:12px">'+esc(why)+'</pre>';
})();

$('#q').addEventListener('input',applyFilter);
$('#sort').addEventListener('change',applySort);
$('#types').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;
  document.querySelectorAll('#types button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));applyFilter();});
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).colorScheme==='dark'?'light':'dark';};
</script>
</body>
</html>
