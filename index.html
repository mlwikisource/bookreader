<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Wikimedia Commons Reader</title>
    <!-- Configure Tailwind CSS before loading the CDN script -->
    <script>
        window.tailwind = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        };
    </script>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Modern smooth animations & perspective */
        .page-container {
            perspective: 2000px;
        }

        .page-card {
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, filter 0.3s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .page-card.flipping-next {
            animation: flipNext 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .page-card.flipping-prev {
            animation: flipPrev 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes flipNext {
            0% { transform: rotateY(0deg); opacity: 0.8; }
            50% { transform: rotateY(-12deg) scale(0.97); opacity: 0.9; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        @keyframes flipPrev {
            0% { transform: rotateY(0deg); opacity: 0.8; }
            50% { transform: rotateY(12deg) scale(0.97); opacity: 0.9; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        /* Loading Spinner Ripple */
        .lds-ripple {
            display: inline-block;
            position: relative;
            width: 72px;
            height: 72px;
        }
        .lds-ripple div {
            position: absolute;
            border: 3px solid #38bdf8;
            opacity: 1;
            border-radius: 50%;
            animation: lds-ripple 1.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        .lds-ripple div:nth-child(2) {
            animation-delay: -0.6s;
        }
        @keyframes lds-ripple {
            0% { top: 32px; left: 32px; width: 0; height: 0; opacity: 0; }
            4.9% { top: 32px; left: 32px; width: 0; height: 0; opacity: 0; }
            5% { top: 32px; left: 32px; width: 0; height: 0; opacity: 1; }
            100% { top: 0px; left: 0px; width: 64px; height: 64px; opacity: 0; }
        }

        /* Modern styled scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Prevent unwanted highlighting on mobile gestures */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden no-select">

    <!-- Header Navigation Bar -->
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 md:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2.5 z-30 shadow-lg">
        <!-- Logo & Active Document Title -->
        <div class="flex items-center space-x-3 min-w-0">

    <!-- Reader Application Logic Script -->
    <script>
        /**
         * Wikimedia Commons Reader Application Logic
         */
        class CommonsReader {
            constructor() {
                // Application State
                this.fileName = '';
                this.totalPages = 0;
                this.currentPage = 1;
                this.pagesPerView = 1;
                this.zoomLevel = 1.0;
                this.pageWidth = 1000; // Base rendering quality resolution
                this.fileInfo = {};
                this.isLoading = false;

                // Touch swipe tracking variables
                this.touchStartX = 0;
                this.touchEndX = 0;

                // DOM Reference Elements
                this.elements = {
                    viewport: document.getElementById('main-viewport'),
                    stage: document.getElementById('reader-stage'),
                    wrapper: document.getElementById('pages-wrapper'),
                    loadingOverlay: document.getElementById('loading-overlay'),
                    loadingStatus: document.getElementById('loading-status'),
                    loadingSubtext: document.getElementById('loading-subtext'),
                    docTitle: document.getElementById('doc-title'),
                    urlInput: document.getElementById('wiki-url-input'),
                    urlForm: document.getElementById('url-form'),
                    pageInput: document.getElementById('page-number-input'),
                    totalPagesDisplay: document.getElementById('total-pages-display'),
                    zoomDisplay: document.getElementById('zoom-level-text'),
                    infoModal: document.getElementById('info-modal'),
                    infoContent: document.getElementById('info-content'),
                    footerPageIndicator: document.getElementById('footer-page-indicator'),
                    btnPrev: document.getElementById('btn-prev-page'),
                    btnNext: document.getElementById('btn-next-page'),
                    btnFirst: document.getElementById('btn-first-page'),
                    btnLast: document.getElementById('btn-last-page'),
                    arrowPrev: document.getElementById('arrow-prev'),
                    arrowNext: document.getElementById('arrow-next')
                };

                this.initEvents();
                this.checkUrlParams();
            }

            /**
             * Initialize event handlers and touch/keyboard listeners
             */
            initEvents() {
                // Form Submit URL Loading
                this.elements.urlForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const url = this.elements.urlInput.value.trim();
                    if (url) this.loadFromUrl(url);
                });

                // Layout View Mode Switches
                document.querySelectorAll('.layout-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const count = parseInt(e.currentTarget.getAttribute('data-pages'));
                        this.setLayoutMode(count);
                    });
                });

                // Navigation Controls
                this.elements.btnPrev.addEventListener('click', () => this.navigatePage(-this.pagesPerView));
                this.elements.btnNext.addEventListener('click', () => this.navigatePage(this.pagesPerView));
                this.elements.arrowPrev.addEventListener('click', () => this.navigatePage(-this.pagesPerView));
                this.elements.arrowNext.addEventListener('click', () => this.navigatePage(this.pagesPerView));
                
                this.elements.btnFirst.addEventListener('click', () => this.goToPage(1));
                this.elements.btnLast.addEventListener('click', () => this.goToPage(this.totalPages));

                this.elements.pageInput.addEventListener('change', (e) => {
                    let page = parseInt(e.target.value);
                    if (isNaN(page)) page = 1;
                    this.goToPage(page);
                });

                // Zoom Controls
                document.getElementById('btn-zoom-in').addEventListener('click', () => this.adjustZoom(0.15));
                document.getElementById('btn-zoom-out').addEventListener('click', () => this.adjustZoom(-0.15));
                document.getElementById('btn-zoom-reset').addEventListener('click', () => this.resetZoom());

                // Fullscreen Toggle
                document.getElementById('btn-fullscreen').addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                    }
                });

                // Metadata Modal
                document.getElementById('btn-info').addEventListener('click', () => {
                    if (this.fileName) {
                        this.elements.infoModal.classList.remove('hidden');
                    }
                });
                document.getElementById('btn-close-info').addEventListener('click', () => {
                    this.elements.infoModal.classList.add('hidden');
                });

                // Keyboard Shortcuts
                window.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    if (e.key === 'ArrowLeft') this.navigatePage(-this.pagesPerView);
                    if (e.key === 'ArrowRight') this.navigatePage(this.pagesPerView);
                    if (e.key === '+' || e.key === '=') this.adjustZoom(0.15);
                    if (e.key === '-') this.adjustZoom(-0.15);
                    if (e.key === '0') this.resetZoom();
                });

                // Touch / Swipe Navigation Support
                this.elements.viewport.addEventListener('touchstart', (e) => {
                    this.touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                this.elements.viewport.addEventListener('touchend', (e) => {
                    this.touchEndX = e.changedTouches[0].screenX;
                    this.handleSwipeGesture();
                }, { passive: true });
            }

            handleSwipeGesture() {
                const swipeThreshold = 50; // threshold in pixels
                const diff = this.touchStartX - this.touchEndX;
                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        // Swiped left -> Next page
                        this.navigatePage(this.pagesPerView);
                    } else {
                        // Swiped right -> Previous page
                        this.navigatePage(-this.pagesPerView);
                    }
                }
            }

            /**
             * Auto load file if specified in URL query parameter
             */
            checkUrlParams() {
                const urlParams = new URLSearchParams(window.location.search);
                const fileParam = urlParams.get('file') || urlParams.get('url');

                if (fileParam) {
                    this.elements.urlInput.value = fileParam;
                    this.loadFromUrl(fileParam);
                } else {
                    // Default file load sample
                    const defaultUrl = 'https://commons.wikimedia.org/wiki/File:Kulastreeyum_Chanthapennum_Undayathengane.djvu';
                    this.elements.urlInput.value = defaultUrl;
                    this.loadFromUrl(defaultUrl);
                }
            }

            /**
             * Parse Wikimedia File Name from input
             */
            extractFileName(input) {
                let clean = input.trim();
                try { clean = decodeURIComponent(clean); } catch(e){}

                if (clean.includes('wikimedia.org/wiki/')) {
                    clean = clean.split('wikimedia.org/wiki/')[1];
                }
                
                clean = clean.split('?')[0].split('#')[0];

                if (!clean.startsWith('File:')) {
                    clean = 'File:' + clean;
                }

                return clean;
            }

            /**
             * Main document fetch & loader
             */
            async loadFromUrl(url) {
                const fileName = this.extractFileName(url);
                if (!fileName) return;

                this.showLoading(true, 'Connecting to Wikimedia Commons...', 'Fetching document structure');
                this.fileName = fileName;
                this.elements.docTitle.innerText = fileName.replace('File:', '').replaceAll('_', ' ');

                try {
                    const apiUrl = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileName)}&prop=imageinfo&iiprop=size|mime|url|extmetadata&format=json&origin=*`;
                    
                    const response = await fetch(apiUrl);
                    const data = await response.json();
                    
                    const pages = data.query?.pages;
                    const pageId = Object.keys(pages)[0];

                    if (pageId === '-1' || !pages[pageId]) {
                        throw new Error('File not found on Wikimedia Commons.');
                    }

                    const imageInfo = pages[pageId].imageinfo?.[0];
                    if (!imageInfo) {
                        throw new Error('Unable to retrieve image details.');
                    }

                    this.fileInfo = {
                        mime: imageInfo.mime,
                        size: (imageInfo.size / (1024 * 1024)).toFixed(2) + ' MB',
                        width: imageInfo.width,
                        height: imageInfo.height,
                        url: imageInfo.url,
                        descriptionUrl: imageInfo.descriptionurl,
                        extmetadata: imageInfo.extmetadata || {}
                    };

                    this.totalPages = imageInfo.page_count || 1;
                    this.currentPage = 1;

                    this.elements.totalPagesDisplay.innerText = `/ ${this.totalPages}`;
                    this.elements.pageInput.max = this.totalPages;
                    this.updateInfoModal();

                    this.setLayoutMode(1);
                    await this.renderCurrentView();

                    try {
                        history.replaceState(null, '', `?file=${encodeURIComponent(fileName)}`);
                    } catch (e) {
                        console.warn('History state update suppressed:', e);
                    }

                } catch (error) {
                    console.error('Error loading Commons file:', error);
                    alert('Error loading file: ' + error.message);
                } finally {
                    this.showLoading(false);
                }
            }

            /**
             * Generate Wikimedia Commons rendered page thumbnail URL
             */
            getPageImageUrl(pageNumber, width = this.pageWidth) {
                const cleanName = this.fileName.replace('File:', '');
                return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(cleanName)}?width=${width}&page=${pageNumber}`;
            }

            /**
             * Set layout view mode
             */
            setLayoutMode(count) {
                this.pagesPerView = count;

                document.querySelectorAll('.layout-btn').forEach(btn => {
                    const btnCount = parseInt(btn.getAttribute('data-pages'));
                    if (btnCount === count) {
                        btn.classList.add('bg-brand-600', 'text-white', 'shadow-md');
                        btn.classList.remove('text-slate-300', 'hover:bg-slate-800');
                    } else {
                        btn.classList.remove('bg-brand-600', 'text-white', 'shadow-md');
                        btn.classList.add('text-slate-300', 'hover:bg-slate-800');
                    }
                });

                this.renderCurrentView();
            }

            /**
             * Render active view pages into DOM
             */
            async renderCurrentView(direction = 'none') {
                if (!this.fileName) return;

                this.elements.wrapper.innerHTML = '';

                const pagesToRender = [];
                for (let i = 0; i < this.pagesPerView; i++) {
                    const targetPage = this.currentPage + i;
                    if (targetPage <= this.totalPages) {
                        pagesToRender.push(targetPage);
                    }
                }

                // Render page cards
                pagesToRender.forEach(pageNum => {
                    const card = document.createElement('div');
                    card.className = 'page-card relative bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col items-center justify-between min-h-[350px] max-w-full transition-all';
                    
                    if (direction === 'next') card.classList.add('flipping-next');
                    if (direction === 'prev') card.classList.add('flipping-prev');

                    // Loader element
                    const loader = document.createElement('div');
                    loader.className = 'absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10 p-4 text-center';
                    loader.innerHTML = `
                        <i class="fa-solid fa-spinner fa-spin text-brand-400 text-2xl mb-3"></i>
                        <span class="text-xs text-slate-400 font-medium">Loading Page ${pageNum}...</span>
                    `;
                    card.appendChild(loader);

                    // Page Image
                    const img = document.createElement('img');
                    img.className = 'max-h-[72vh] md:max-h-[78vh] w-auto max-w-full object-contain block transition-opacity duration-300 opacity-0';
                    img.alt = `Page ${pageNum}`;
                    img.src = this.getPageImageUrl(pageNum);

                    img.onload = () => {
                        loader.remove();
                        img.classList.remove('opacity-0');
                    };

                    img.onerror = () => {
                        loader.innerHTML = `
                            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-2"></i>
                            <span class="text-xs text-slate-400">Failed to render Page ${pageNum}</span>
                        `;
                    };

                    // Bottom Tag
                    const pageTag = document.createElement('div');
                    pageTag.className = 'w-full text-center py-1.5 bg-slate-950/90 text-slate-400 text-[11px] border-t border-slate-800 font-mono';
                    pageTag.innerText = `Page ${pageNum} of ${this.totalPages}`;

                    card.appendChild(img);
                    card.appendChild(pageTag);
                    this.elements.wrapper.appendChild(card);
                });

                // Sync controls & footer
                this.elements.pageInput.value = this.currentPage;
                const endPage = Math.min(this.currentPage + this.pagesPerView - 1, this.totalPages);
                const pageRangeStr = this.pagesPerView > 1 && endPage > this.currentPage 
                    ? `Pages ${this.currentPage}-${endPage} / ${this.totalPages}`
                    : `Page ${this.currentPage} / ${this.totalPages}`;
                this.elements.footerPageIndicator.innerText = pageRangeStr;

                this.updateNavButtons();
            }

            /**
             * Navigation logic
             */
            navigatePage(offset) {
                const newPage = this.currentPage + offset;
                const direction = offset > 0 ? 'next' : 'prev';
                this.goToPage(newPage, direction);
            }

            goToPage(pageNumber, direction = 'none') {
                if (pageNumber < 1) pageNumber = 1;
                if (pageNumber > this.totalPages) pageNumber = this.totalPages;

                this.currentPage = pageNumber;
                this.renderCurrentView(direction);
            }

            /**
             * Zoom Adjustments
             */
            adjustZoom(delta) {
                this.zoomLevel = Math.max(0.5, Math.min(2.5, this.zoomLevel + delta));
                this.applyZoom();
            }

            resetZoom() {
                this.zoomLevel = 1.0;
                this.applyZoom();
            }

            applyZoom() {
                this.elements.wrapper.style.transform = `scale(${this.zoomLevel})`;
                this.elements.zoomDisplay.innerText = `${Math.round(this.zoomLevel * 100)}%`;
            }

            /**
             * Update navigation UI buttons status
             */
            updateNavButtons() {
                const isFirst = this.currentPage <= 1;
                const isLast = (this.currentPage + this.pagesPerView - 1) >= this.totalPages;

                this.elements.btnPrev.disabled = isFirst;
                this.elements.arrowPrev.disabled = isFirst;
                this.elements.btnFirst.disabled = isFirst;

                this.elements.btnNext.disabled = isLast;
                this.elements.arrowNext.disabled = isLast;
                this.elements.btnLast.disabled = isLast;
            }

            /**
             * Populate Metadata Modal
             */
            updateInfoModal() {
                const meta = this.fileInfo.extmetadata || {};
                const getVal = (key) => meta[key] ? meta[key].value : 'N/A';

                this.elements.infoContent.innerHTML = `
                    <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-2 font-mono text-[11px]">
                        <div class="flex justify-between gap-2"><span class="text-slate-400 shrink-0">File:</span> <span class="font-medium text-white truncate">${this.fileName.replace('File:', '')}</span></div>
                        <div class="flex justify-between gap-2"><span class="text-slate-400 shrink-0">Total Pages:</span> <span class="font-medium text-white">${this.totalPages}</span></div>
                        <div class="flex justify-between gap-2"><span class="text-slate-400 shrink-0">MIME Type:</span> <span class="font-medium text-white">${this.fileInfo.mime || 'N/A'}</span></div>
                        <div class="flex justify-between gap-2"><span class="text-slate-400 shrink-0">File Size:</span> <span class="font-medium text-white">${this.fileInfo.size}</span></div>
                    </div>
                    <div class="space-y-2.5 pt-2">
                        <div><strong class="text-slate-300 block">Title / Object Name:</strong> <p class="text-slate-400 mt-0.5 text-xs">${getVal('ObjectName')}</p></div>
                        <div><strong class="text-slate-300 block">License:</strong> <p class="text-slate-400 mt-0.5 text-xs">${getVal('LicenseShortName')}</p></div>
                        <div><strong class="text-slate-300 block">Artist / Author:</strong> <p class="text-slate-400 mt-0.5 text-xs">${getVal('Artist') || getVal('Categories')}</p></div>
                    </div>
                    <div class="pt-3 border-t border-slate-800">
                        <a href="${this.fileInfo.descriptionUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-brand-400 hover:text-brand-300 text-xs font-medium">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open on Wikimedia Commons
                        </a>
                    </div>
                `;
            }

            showLoading(show, title = 'Loading...', subtext = '') {
                this.isLoading = show;
                if (show) {
                    this.elements.loadingStatus.innerText = title;
                    this.elements.loadingSubtext.innerText = subtext;
                    this.elements.loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
                } else {
                    this.elements.loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                }
            }
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            window.readerApp = new CommonsReader();
        });
    </script>
</body>
</html>
